openapi: 3.0.3
info:
  title: Aurex Membership Management API
  description: >
    Membership Management (C-007, WP-03) endpoints for the Aurex
    AuthService. Covers BA-01 (Establish Membership Context), BA-02
    (Understand Membership Context), BA-03 (Maintain Membership
    Terms — EX-C007-04/05 only; EX-C007-06 Reconfirm Home-Node
    Structural Congruence is out of scope, see IMP-REPORT-WP-03),
    BA-06 (Reactivate Membership, EX-C007-08 — every call currently
    rejected with 409 per BR-C007-014/Contract 5.3, no canonical
    authority establishing a permitted transition to ACTIVE exists;
    see TD-037), BA-07 (Surface Multi-Organization Membership
    Awareness, EX-C007-09 — existence-only signal per BR-C007-008/
    Contract 5.4, never cross-tenant detail, see TD-040), BA-08
    (Present Person's Own Cross-Organization Membership View,
    EX-C007-10 — full-detail, self-service only per BR-C007-009; the
    'authorized aggregator' persona is not implemented, see TD-041),
    BA-09 (Preserve Membership Context Across Enterprise Journeys,
    EX-C007-11 — fully satisfied by BA-02's existing GET
    /memberships/{membership_id}, no new endpoint), and BA-10 (Hand
    Off Membership Context to a Dependent Capability, EX-C007-12 — the
    caller reports an already-resolved outcome per Contract 5.10; C-007
    never calls into any dependent capability's own API, see TD-042).
    BA-04 and BA-05 are formally BLOCKED (see IMP-REPORT-WP-03); see
    IRA-003 for the full six-ERB/thirteen-EX Business Activity mapping.
    Authorization gate: PLATFORM_ADMIN for all endpoints except
    GET /memberships/my-portfolio, which requires only a valid access
    token (self-service — BR-C007-009). Persona-specific defining
    authority per EX-C007-02's Membership Steward/Sponsor personas is
    deferred, tracked as TD-031; EX-C007-03's Sponsor/Steward/
    Downstream Capability Consumer/Executive personas, TD-034;
    EX-C007-04/05's Steward/Sponsor personas, TD-035; EX-C007-08's
    Steward/Sponsor personas, TD-036; EX-C007-09's Sponsor/Steward/
    Platform Oversight Participant personas, TD-039; EX-C007-10's
    authorized-aggregator persona, TD-041; EX-C007-12's Steward/
    Downstream Capability Consumer personas, TD-042.
  version: 1.0.0
paths:
  /memberships/my-portfolio:
    get:
      summary: Present the caller's own cross-organization Membership portfolio
      description: >
        WP-03 Business Activity: Present Person's Own Cross-Organization
        Membership View, realizing PE-001-C007's ERB-C007-05 /
        EX-C007-10. Requires only a valid access token — no role gate —
        since BR-C007-009 entitles a Membership Subject to see the
        complete detail of their own Membership portfolio. person_id is
        taken from the caller's own verified claims, never a query
        parameter. See TD-041.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's own complete Membership portfolio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPortfolioResponse'
        '400':
          description: Missing or malformed Authorization header.
        '401':
          description: Access token invalid or expired.
  /memberships/multi-organization-awareness:
    get:
      summary: Surface multi-organization Membership awareness
      description: >
        WP-03 Business Activity: Surface Multi-Organization Membership
        Awareness During Establishment, realizing PE-001-C007's
        ERB-C007-05 / EX-C007-09. Requires the PLATFORM_ADMIN role. Per
        BR-C007-008/Contract 5.4, returns at most an existence-only
        signal that the Person holds an ACTIVE Membership in an
        Organization other than the one supplied — never which
        Organization, on what terms, or under what standing
        (URA-001-17a). See TD-040.
      security:
        - bearerAuth: []
      parameters:
        - name: person_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Existence-only awareness signal computed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiOrganizationAwarenessResponse'
        '400':
          description: Missing or malformed Authorization header.
        '401':
          description: Access token invalid or expired.
        '403':
          description: Caller does not hold the PLATFORM_ADMIN role.
        '404':
          description: No Person or Organization exists with the supplied id.
  /memberships/{membership_id}:
    get:
      summary: Understand a Membership's authoritative context
      description: >
        WP-03 Business Activity: Understand Membership Context, realizing
        PE-001-C007's ERB-C007-02 / EX-C007-03. Requires the PLATFORM_ADMIN
        role. Presents the Membership's stored terms/standing/home-node
        fields unchanged, plus a freshly computed authority_consequence/
        currently_effective pair — an ACTIVE Membership past its
        effective_to is never presented as currently effective
        (BR-C007-013).
      security:
        - bearerAuth: []
      parameters:
        - name: membership_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Membership found; authority consequence freshly computed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipUnderstandingResponse'
        '400':
          description: Missing or malformed Authorization header.
        '401':
          description: Access token invalid or expired.
        '403':
          description: Caller does not hold the PLATFORM_ADMIN role.
        '404':
          description: No Membership exists with this id.
        '422':
          description: membership_id is not a valid UUID.
  /memberships/{membership_id}/terms:
    post:
      summary: Maintain a Membership's terms
      description: >
        WP-03 Business Activity: Maintain Membership Terms, realizing
        PE-001-C007's ERB-C007-03 / EX-C007-04 (Resolve Conflicting
        Membership Terms) + EX-C007-05 (Change Membership Terms).
        Requires the PLATFORM_ADMIN role. At least one supplied field
        must genuinely differ from the Membership's current value, or
        the request is classified erroneous and rejected with 409
        (BR-C007-003). The prior value of every changed field is
        preserved in the audit trail (BR-C007-004). EX-C007-06
        (Reconfirm Home-Node Structural Congruence) is out of scope.
      security:
        - bearerAuth: []
      parameters:
        - name: membership_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeMembershipTermsRequest'
      responses:
        '200':
          description: Terms changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '400':
          description: Missing or malformed Authorization header.
        '401':
          description: Access token invalid or expired.
        '403':
          description: Caller does not hold the PLATFORM_ADMIN role.
        '404':
          description: No Membership exists with this id, or the supplied home_node_id does not exist.
        '409':
          description: Requested terms match the Membership's current terms, or the supplied home_node_id is not active.
        '422':
          description: No term field was supplied.
  /memberships/{membership_id}/reactivate:
    post:
      summary: Reactivate a non-active Membership
      description: >
        WP-03 Business Activity: Reactivate Membership, realizing
        PE-001-C007's ERB-C007-04 / EX-C007-08. Requires the
        PLATFORM_ADMIN role. Per BR-C007-014 and Contract 5.3, no
        canonical authority anywhere establishes that any non-active
        standing may transition to ACTIVE, so every call is currently
        rejected with 409 (Pending Canonical Binding) and the existing
        Membership is preserved unchanged — this is not a defect, it
        is EX-C007-08's own explicitly named rejection/unresolved
        completion path. See TD-037.
      security:
        - bearerAuth: []
      parameters:
        - name: membership_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactivateMembershipRequest'
      responses:
        '200':
          description: Membership reactivated. Not currently reachable — see TD-037.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '400':
          description: Missing or malformed Authorization header.
        '401':
          description: Access token invalid or expired.
        '403':
          description: Caller does not hold the PLATFORM_ADMIN role.
        '404':
          description: No Membership exists with this id.
        '409':
          description: Membership is already ACTIVE, or reactivation from its current standing is not permitted (Pending Canonical Binding, TD-037).
  /memberships/{membership_id}/hand-off:
    post:
      summary: Hand off a Membership context to a dependent capability
      description: >
        WP-03 Business Activity: Hand Off Membership Context to a
        Dependent Capability, realizing PE-001-C007's ERB-C007-06 /
        EX-C007-12. Requires the PLATFORM_ADMIN role. Per Contract
        5.10, C-007 never calls into the named dependent capability's
        own API — the caller reports the already-resolved outcome
        (accepted or returned, never assumed from silence). The
        transferred context is bounded to the same shape GET
        /memberships/{membership_id} already returns, plus a freshly
        recomputed authority consequence (BR-C007-010). A downstream
        rejection never alters the underlying Membership (BR-C007-011).
        See TD-042.
      security:
        - bearerAuth: []
      parameters:
        - name: membership_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandOffMembershipContextRequest'
      responses:
        '200':
          description: Hand-off outcome recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipHandoffResponse'
        '400':
          description: Missing or malformed Authorization header.
        '401':
          description: Access token invalid or expired.
        '403':
          description: Caller does not hold the PLATFORM_ADMIN role.
        '404':
          description: No Membership exists with this id.
        '422':
          description: outcome=RETURNED was supplied without a reason.
  /memberships:
    post:
      summary: Establish a new Membership Context
      description: >
        WP-03 Business Activity: Establish Membership Context, realizing
        PE-001-C007's ERB-C007-01 / EX-C007-01 (Recognize Existing
        Membership) + EX-C007-02 (Establish New Membership). Requires the
        PLATFORM_ADMIN role. Rejects an unknown Person, Organization,
        Role, or home_node_id with 404, an inactive home_node_id with
        409, and a duplicate Membership for the same (person_id,
        organization_id) pair with 409 (BR-C007-001).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstablishMembershipRequest'
      responses:
        '201':
          description: Membership established.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '400':
          description: Missing or malformed Authorization header.
        '401':
          description: Access token invalid or expired.
        '403':
          description: Caller does not hold the PLATFORM_ADMIN role.
        '404':
          description: The target Person, Organization, Role, or home_node_id does not exist.
        '409':
          description: A Membership already exists for this person/organization pair, or the supplied home_node_id is not active.
        '422':
          description: Invalid request (e.g., missing required field).
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EstablishMembershipRequest:
      type: object
      required:
        - person_id
        - organization_id
        - role_id
      properties:
        person_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        role_id:
          type: string
          format: uuid
        home_node_id:
          type: string
          format: uuid
          nullable: true
        membership_type:
          type: string
          enum: [INTERNAL, EXTERNAL]
          default: INTERNAL
        license_type:
          type: string
          enum: [FULL, LIGHT]
          default: FULL
        effective_from:
          type: string
          format: date-time
          nullable: true
        effective_to:
          type: string
          format: date-time
          nullable: true
        is_primary:
          type: boolean
          default: false
    MembershipResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        role_id:
          type: string
          format: uuid
        home_node_id:
          type: string
          format: uuid
          nullable: true
        membership_type:
          type: string
        license_type:
          type: string
        membership_status:
          type: string
        is_primary:
          type: boolean
        effective_from:
          type: string
          format: date-time
        effective_to:
          type: string
          format: date-time
          nullable: true
        joined_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
    ChangeMembershipTermsRequest:
      type: object
      description: >
        All fields optional (only-supplied-fields semantics). At least
        one supplied field must differ from the Membership's current
        value (BR-C007-003).
      properties:
        membership_type:
          type: string
          enum: [INTERNAL, EXTERNAL]
        license_type:
          type: string
          enum: [FULL, LIGHT]
        home_node_id:
          type: string
          format: uuid
          nullable: true
        effective_from:
          type: string
          format: date-time
          nullable: true
        effective_to:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          maxLength: 500
          nullable: true
    ReactivateMembershipRequest:
      type: object
      description: >
        Per BR-C007-014/Contract 5.3, no canonical authority establishes
        that any non-active standing may transition to ACTIVE, so every
        call is currently rejected with 409 regardless of the supplied
        reason. See TD-037.
      properties:
        reason:
          type: string
          maxLength: 500
          nullable: true
    MembershipPortfolioResponse:
      type: object
      description: >
        Per BR-C007-009, the complete detail of the caller's own
        Membership portfolio across every Organization they participate
        in — not restricted by URA-001-17a, since this is the Person's
        own data.
      properties:
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/MembershipResponse'
      required:
        - memberships
    MultiOrganizationAwarenessResponse:
      type: object
      description: >
        Per BR-C007-008/Contract 5.4, existence-only — never which
        Organization, on what terms, or under what standing
        (URA-001-17a).
      properties:
        has_memberships_in_other_organizations:
          type: boolean
      required:
        - has_memberships_in_other_organizations
    MembershipUnderstandingResponse:
      allOf:
        - $ref: '#/components/schemas/MembershipResponse'
        - type: object
          properties:
            currently_effective:
              type: boolean
              description: >
                True only when membership_status is ACTIVE and now falls
                within [effective_from, effective_to). BR-C007-013: an
                ACTIVE Membership past its effective_to is never presented
                as currently effective.
            authority_consequence:
              type: string
              enum: [ACTIVE_AND_EFFECTIVE, ACTIVE_NOT_YET_EFFECTIVE, ACTIVE_BUT_LAPSED, NOT_ACTIVE]
              description: The reasoned classification behind currently_effective.
    HandOffMembershipContextRequest:
      type: object
      description: >
        Per Contract 5.10, the caller reports the already-resolved
        outcome - C-007 never calls into the named dependent
        capability's own API.
      properties:
        dependent_capability:
          type: string
          enum: [C-003, C-002, C-008]
          description: Role & Permission Management, Access Management, or Workspace Management (Contract 5.10 - exactly these three).
        outcome:
          type: string
          enum: [ACCEPTED, RETURNED]
        reason:
          type: string
          maxLength: 1000
          nullable: true
          description: Required when outcome=RETURNED.
      required:
        - dependent_capability
        - outcome
    MembershipHandoffResponse:
      type: object
      description: >
        Composes MembershipUnderstandingResponse as the transferred
        context (Contract 5.10 - bounded, never C-007's complete
        internal decision history).
      properties:
        membership_context:
          $ref: '#/components/schemas/MembershipUnderstandingResponse'
        dependent_capability:
          type: string
          enum: [C-003, C-002, C-008]
        outcome:
          type: string
          enum: [ACCEPTED, RETURNED]
        reason:
          type: string
          nullable: true
        handed_off_at:
          type: string
          format: date-time
      required:
        - membership_context
        - dependent_capability
        - outcome
        - handed_off_at
