openapi: 3.0.3
info:
  title: CorpStage Membership Management API
  description: >
    Membership Management (C-007, WP-03) endpoints for the CorpStage
    AuthService. Covers BA-01 (Establish Membership Context) only —
    see IRA-003 for the full six-ERB/thirteen-EX Business Activity
    mapping; BA-02 onward are not yet implemented. Authorization gate:
    PLATFORM_ADMIN (persona-specific defining authority per EX-C007-02's
    Membership Steward/Sponsor personas is deferred, tracked as TD-031).
  version: 1.0.0
paths:
  /memberships:
    post:
      summary: Establish a new Membership Context
      description: >
        WP-03 Business Activity: Establish Membership Context, realizing
        PE-001-C007's ERB-C007-01 / EX-C007-01 (Recognize Existing
        Membership) + EX-C007-02 (Establish New Membership). Requires the
        PLATFORM_ADMIN role. Rejects an unknown Person, Organization,
        Role, or home_node_id with 404, an inactive home_node_id with
        409, and a duplicate Membership for the same (person_id,
        organization_id) pair with 409 (BR-C007-001).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstablishMembershipRequest'
      responses:
        '201':
          description: Membership established.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '400':
          description: Missing or malformed Authorization header.
        '401':
          description: Access token invalid or expired.
        '403':
          description: Caller does not hold the PLATFORM_ADMIN role.
        '404':
          description: The target Person, Organization, Role, or home_node_id does not exist.
        '409':
          description: A Membership already exists for this person/organization pair, or the supplied home_node_id is not active.
        '422':
          description: Invalid request (e.g., missing required field).
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EstablishMembershipRequest:
      type: object
      required:
        - person_id
        - organization_id
        - role_id
      properties:
        person_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        role_id:
          type: string
          format: uuid
        home_node_id:
          type: string
          format: uuid
          nullable: true
        membership_type:
          type: string
          enum: [INTERNAL, EXTERNAL]
          default: INTERNAL
        license_type:
          type: string
          enum: [FULL, LIGHT]
          default: FULL
        effective_from:
          type: string
          format: date-time
          nullable: true
        effective_to:
          type: string
          format: date-time
          nullable: true
        is_primary:
          type: boolean
          default: false
    MembershipResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        role_id:
          type: string
          format: uuid
        home_node_id:
          type: string
          format: uuid
          nullable: true
        membership_type:
          type: string
        license_type:
          type: string
        membership_status:
          type: string
        is_primary:
          type: boolean
        effective_from:
          type: string
          format: date-time
        effective_to:
          type: string
          format: date-time
          nullable: true
        joined_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
