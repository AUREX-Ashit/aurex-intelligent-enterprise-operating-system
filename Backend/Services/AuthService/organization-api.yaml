openapi: 3.0.3
info:
  title: CorpStage Organization Management API
  description: >
    Organization Management (C-004, WP-01) endpoints for the CorpStage
    AuthService. Implementation ownership: ADR-003. Schema scope: ADR-004.
    Lifecycle model: ADR-005, extended by BA-07 to a third, terminal
    RETIRED state per ERB-C004-07 (PE-001-C004). Covers all 7 Business
    Activities of WP-01's Scope Reconciliation (IRA-001 §15): BA-01
    (Establish Organization Identity), BA-02 (Resolve Organization
    Details), BA-03 (Search & List Organizations), BA-04 (Steward
    Organization Identity), BA-05 (Reactivate Suspended Organization),
    BA-06 (Suspend Organization), and BA-07 (Retire Organization &
    Preserve Continuity) — the final Business Activity of WP-01.
  version: 1.0.0
paths:
  /organizations:
    post:
      summary: Establish a new organization
      description: >
        WP-01 Business Activity 1: Establish Organization. Requires the
        PLATFORM_ADMIN role — IRA-001 §2.7 documents this as a deliberate
        simplification pending the Role & Permission Management work
        package's Domain Permission model. Rejects a duplicate
        organization_code with 409. Tenant-agnostic: establishing a
        brand-new organization has no existing tenant to scope the
        request to (X-Tenant-ID is not required or read).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstablishOrganizationRequest'
      responses:
        '201':
          description: Organization established.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          description: Missing or malformed Authorization header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '401':
          description: Access token invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '403':
          description: Caller does not hold the PLATFORM_ADMIN role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '409':
          description: An organization with this organization_code already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '422':
          description: Invalid request (e.g., missing or empty required field).

    get:
      summary: Search and list organizations
      description: >
        WP-01 Business Activity 3: Search & List Organizations. Requires the
        PLATFORM_ADMIN role, same interim gate as the other Organization
        Management endpoints (IRA-001 §2.7). q matches organization_name
        or organization_code, case-insensitive, substring. Tenant-agnostic,
        same basis as Establish Organization.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 255
          description: Search text against organization_name or organization_code.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: ["ACTIVE", "SUSPENDED", "RETIRED"]
          description: Filter by lifecycle status.
        - name: skip
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: ["organization_name", "organization_code", "created_at"]
            default: "organization_name"
        - name: sort_order
          in: query
          required: false
          schema:
            type: string
            enum: ["asc", "desc"]
            default: "asc"
      responses:
        '200':
          description: A page of matching organizations, with a total count for pagination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
        '400':
          description: Missing or malformed Authorization header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '401':
          description: Access token invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '403':
          description: Caller does not hold the PLATFORM_ADMIN role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '422':
          description: Invalid query parameters.

  /organizations/{organization_id}:
    get:
      summary: View organization details
      description: >
        WP-01 Business Activity 2: View Organization Details. Requires the
        PLATFORM_ADMIN role, same interim gate as Establish Organization
        (IRA-001 §2.7). Tenant-agnostic, same basis as Establish Organization.
      security:
        - bearerAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Organization found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          description: Missing or malformed Authorization header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '401':
          description: Access token invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '403':
          description: Caller does not hold the PLATFORM_ADMIN role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '404':
          description: No organization exists with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '422':
          description: organization_id is not a valid UUID.

    put:
      summary: Update organization profile
      description: >
        WP-01 Business Activity 4: Update Organization Profile. Requires
        the PLATFORM_ADMIN role, same interim gate as the other
        Organization Management endpoints (IRA-001 §2.7). Updates
        organization_name, organization_type, and description;
        organization_code and lifecycle status are not part of this
        Business Activity's scope. Tenant-agnostic, same basis as View
        Organization Details.
      security:
        - bearerAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationProfileRequest'
      responses:
        '200':
          description: Organization profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          description: Missing or malformed Authorization header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '401':
          description: Access token invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '403':
          description: Caller does not hold the PLATFORM_ADMIN role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '404':
          description: No organization exists with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '422':
          description: Invalid request (e.g., missing or empty required field).

  /organizations/{organization_id}/activate:
    post:
      summary: Activate organization
      description: >
        WP-01 Business Activity 5: Activate Organization. Requires the
        PLATFORM_ADMIN role, same interim gate as the other Organization
        Management endpoints (IRA-001 §2.7). Transitions status from
        SUSPENDED to ACTIVE per ADR-005's interim lifecycle model.
        Rejects an already-ACTIVE organization with 409 rather than a
        silent no-op, and rejects a RETIRED organization with 409 as well
        — RETIRED is terminal (BA-07, ERB-C004-07) and is never reversible
        via this endpoint. Tenant-agnostic, same basis as View Organization
        Details.
      security:
        - bearerAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Organization activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          description: Missing or malformed Authorization header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '401':
          description: Access token invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '403':
          description: Caller does not hold the PLATFORM_ADMIN role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '404':
          description: No organization exists with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '409':
          description: Organization is already ACTIVE, or is RETIRED and cannot be reactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '422':
          description: organization_id is not a valid UUID.

  /organizations/{organization_id}/suspend:
    post:
      summary: Suspend organization
      description: >
        WP-01 Business Activity 6: Suspend Organization. Requires the
        PLATFORM_ADMIN role, same interim gate as the other Organization
        Management endpoints (IRA-001 §2.7). Transitions status from
        ACTIVE to SUSPENDED per ADR-005's interim lifecycle model.
        Rejects an already-SUSPENDED organization with 409 rather than a
        silent no-op, and rejects a RETIRED organization with 409 as well
        — RETIRED is terminal (BA-07, ERB-C004-07) and is never reversible
        via this endpoint. Tenant-agnostic, same basis as Activate Organization.
      security:
        - bearerAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Organization suspended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          description: Missing or malformed Authorization header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '401':
          description: Access token invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '403':
          description: Caller does not hold the PLATFORM_ADMIN role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '404':
          description: No organization exists with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '409':
          description: Organization is already SUSPENDED, or is RETIRED and cannot be suspended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '422':
          description: organization_id is not a valid UUID.

  /organizations/{organization_id}/retire:
    post:
      summary: Retire organization
      description: >
        WP-01 Business Activity 7 (final): Retire Organization & Preserve
        Continuity, realizing ERB-C004-07 (PE-001-C004). Requires the
        PLATFORM_ADMIN role, same interim gate as the other Organization
        Management endpoints (IRA-001 §2.7). Transitions status to
        RETIRED from either ACTIVE or SUSPENDED. RETIRED is terminal:
        rejects an already-RETIRED organization with 409, and is never
        reversible — activate/suspend both reject a RETIRED organization.
        Preserves continuity: no row is deleted; the organization's
        identity and full history remain queryable via
        GET /organizations/{organization_id}. Tenant-agnostic, same basis
        as Activate/Suspend Organization.
      security:
        - bearerAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Organization retired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          description: Missing or malformed Authorization header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '401':
          description: Access token invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '403':
          description: Caller does not hold the PLATFORM_ADMIN role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '404':
          description: No organization exists with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '409':
          description: Organization is already RETIRED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
        '422':
          description: organization_id is not a valid UUID.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: AuthService access token (from POST /auth/login), carrying a role_code claim.

  schemas:
    EstablishOrganizationRequest:
      type: object
      required:
        - organization_code
        - organization_name
        - organization_type
      properties:
        organization_code:
          type: string
          minLength: 1
          maxLength: 50
          description: Unique organization code (platform-wide).
          example: "ACME-CORP-001"
        organization_name:
          type: string
          minLength: 1
          maxLength: 255
          example: "Acme Corporation"
        organization_type:
          type: string
          minLength: 1
          maxLength: 50
          example: "CORPORATE"
        description:
          type: string
          maxLength: 1000
          nullable: true
          example: "Global manufacturing conglomerate."

    UpdateOrganizationProfileRequest:
      type: object
      required:
        - organization_name
        - organization_type
      properties:
        organization_name:
          type: string
          minLength: 1
          maxLength: 255
          example: "Acme Corporation"
        organization_type:
          type: string
          minLength: 1
          maxLength: 50
          example: "CORPORATE"
        description:
          type: string
          maxLength: 1000
          nullable: true
          example: "Global manufacturing conglomerate."

    OrganizationResponse:
      type: object
      required:
        - id
        - organization_code
        - organization_name
        - organization_type
        - status
        - is_active
        - created_at
      properties:
        id:
          type: string
          format: uuid
        organization_code:
          type: string
          example: "ACME-CORP-001"
        organization_name:
          type: string
          example: "Acme Corporation"
        organization_type:
          type: string
          example: "CORPORATE"
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: ["ACTIVE", "SUSPENDED", "RETIRED"]
          description: ADR-005 interim lifecycle state, extended by BA-07 (ERB-C004-07) to a third, terminal RETIRED state.
          example: "ACTIVE"
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true

    OrganizationListResponse:
      type: object
      required:
        - items
        - total
        - skip
        - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationResponse'
        total:
          type: integer
          description: Total organizations matching the query, independent of pagination.
        skip:
          type: integer
        limit:
          type: integer

    HTTPExceptionResponse:
      type: object
      description: FastAPI's default HTTPException body shape (matches auth-api.yaml's schema of the same name).
      properties:
        detail:
          type: string
          example: "An organization with code 'ACME-CORP-001' already exists."
