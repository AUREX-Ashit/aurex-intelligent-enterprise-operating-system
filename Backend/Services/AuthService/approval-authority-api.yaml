openapi: 3.0.3
info:
  title: Aurex Approval Authority API
  description: >
    Approval Authority establishment (C-003, WP-02 BA-03). Covers
    ERB-C003-01 / EX-C003-03 (Establish Approval Authority) only — see
    IRA-002 for the full ten-Enterprise-Experience Business Activity
    mapping. Authorization gate: PLATFORM_ADMIN (interim, mirroring
    BA-01/BA-02's precedent — Corporate Admin/Domain Owner authority per
    URA-001-32/45 is not yet implementable).
  version: 1.0.0
paths:
  /approval-authorities:
    post:
      summary: Establish a new Approval Authority
      description: >
        WP-02 Business Activity: Establish Approval Authority, realizing
        PE-001-C003's ERB-C003-01 / EX-C003-03. Declares exactly one
        approval_strategy and exactly one scope_type (GLOBAL/COMPANY/
        DOMAIN/OBJECT, URA-001-61) — an ambiguous, dual-stated, or
        incomplete scope is rejected with 422. Rejects an unknown
        Organization or Domain with 404.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstablishApprovalAuthorityRequest'
      responses:
        '201':
          description: Approval Authority established.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalAuthorityResponse'
        '400':
          description: Missing or malformed Authorization header.
        '401':
          description: Access token invalid or expired.
        '403':
          description: Caller does not hold the PLATFORM_ADMIN role.
        '404':
          description: The target Organization or Domain does not exist.
        '422':
          description: Invalid request — scope_type's required anchor missing, or an anchor supplied for the wrong scope_type.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EstablishApprovalAuthorityRequest:
      type: object
      required:
        - organization_id
        - authority_name
        - approval_strategy
        - scope_type
      properties:
        organization_id:
          type: string
          format: uuid
        authority_name:
          type: string
          minLength: 1
          maxLength: 255
        approval_strategy:
          type: string
          enum: [ANY_ONE, ALL, MAJORITY, SEQUENTIAL]
        majority_threshold_pct:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        scope_type:
          type: string
          enum: [GLOBAL, COMPANY, DOMAIN, OBJECT]
        domain_id:
          type: string
          format: uuid
          nullable: true
          description: Required if, and only if, scope_type is DOMAIN.
        object_type:
          type: string
          maxLength: 100
          nullable: true
          description: Required if, and only if, scope_type is OBJECT.
        object_id:
          type: string
          format: uuid
          nullable: true
          description: Required if, and only if, scope_type is OBJECT.
    ApprovalAuthorityResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        authority_name:
          type: string
        approval_strategy:
          type: string
        majority_threshold_pct:
          type: integer
          nullable: true
        scope_type:
          type: string
        domain_id:
          type: string
          format: uuid
          nullable: true
        object_type:
          type: string
          nullable: true
        object_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
