# A generic, single database configuration.

[alembic]
# path to migration scripts.
script_location = %(here)s/alembic

# Migration file name template — date + revision id + slug for easy chronological sorting.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

path_separator = os

# database URL — intentionally left as a placeholder.
# The actual URL is loaded from Config/platform-config.yaml (or AUREX_DATABASE_URL
# env var) by env.py via config.settings.database_url. Do not hard-code credentials here.
# sqlalchemy.url = postgresql+asyncpg://user:pass@localhost:5432/dbname


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
