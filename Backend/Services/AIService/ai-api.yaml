openapi: 3.0.3
info:
  title: CorpStage AI Extraction API
  description: AI extraction and ESG intelligence APIs
  version: 1.0.0
servers:
  - url: https://api.corpstage.com
paths:
  /ai/extract:
    post:
      summary: Extract ESG metrics
      description: Extracts ESG metrics and disclosures using AI
      responses:
        '200':
          description: ESG extraction completed
  /ai/validate:
    post:
      summary: Validate AI extraction
      description: Validates extracted ESG metrics using governance rules
      responses:
        '200':
          description: Validation completed
  /ai/scoring:
    post:
      summary: Calculate ESG Score
      description: Calculates ESG performance score based on extracted metrics
      responses:
        '200':
          description: Scoring completed
  /ai/review:
    post:
      summary: Human review workflow
      description: Initiates review of extraction results and marks as reviewed
      responses:
        '200':
          description: Review processed successfully
  /ai/health:
    get:
      summary: Health endpoint
      description: Returns service health status and dependencies check
      responses:
        '200':
          description: Service is healthy
components: {}
