version: '3.9'

# ==============================================================================
# CorpStage Enterprise Platform - Distributed Architecture Compose Suite
# Includes Core Datastores, Message Brokers, Object Storage, and Microservices
# ==============================================================================

networks:
  corpstage-network:
    driver: bridge
    name: corpstage-network

volumes:
  pg_data:
    name: corpstage_pg_data
  redis_data:
    name: corpstage_redis_data
  kafka_data:
    name: corpstage_kafka_data
  minio_data:
    name: corpstage_minio_data

services:

  # ----------------------------------------------------------------------------
  # Data Store: PostgreSQL 16 (Relational DB / Multi-Tenant Isolation)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: corpstage-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corpstage}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CorpStageMasterDatabasePass123!}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - corpstage-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # Data Store: Redis (Caching & Session Storage Contexts)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: corpstage-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - corpstage-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 8s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Message Broker: Apache Zookeeper (Kafka Coordination Console)
  # ----------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: corpstage-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - corpstage-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "echo stat | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # Message Broker: Apache Kafka (Asynchronous Multi-Tenant Domain Streams)
  # ----------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: corpstage-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - corpstage-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 12s
      timeout: 8s
      retries: 5
      start_period: 20s

  # Kafka Topics Provisioning Container (Gracefully exits after topics auto-generation)
  kafka-init-topics:
    image: confluentinc/cp-kafka:7.5.0
    container_name: corpstage-kafka-init-topics
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - corpstage-network
    entrypoint: [ "sh", "-c" ]
    command: |
      "kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic corpstage.auth.user.events --replication-factor 1 --partitions 3 && \
       kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic corpstage.tenant.provisioning --replication-factor 1 --partitions 3 && \
       kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic corpstage.ingestion.job.updates --replication-factor 1 --partitions 3 && \
       kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic corpstage.ai.inference.logs --replication-factor 1 --partitions 3"

  # ----------------------------------------------------------------------------
  # Storage Object Store: MinIO (Structured / Unstructured ESG Payload Evidence)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-03-03T20-13-08Z
    container_name: corpstage-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-corpstage_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-CorpStageAdminPass123!}
    volumes:
      - minio_data:/data
    networks:
      - corpstage-network
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 768M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # MinIO Bucket Provisioner Helper (Self-terminating bootstrap hook)
  minio-init-buckets:
    image: minio/mc:RELEASE.2024-03-03T22-01-38Z
    container_name: corpstage-minio-init-buckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 corpstage_admin CorpStageAdminPass123!;
      mc mb --ignore-existing local/corpstage-ingestion-payloads;
      mc mb --ignore-existing local/corpstage-esg-evidence;
      exit 0;
      "
    networks:
      - corpstage-network

  # ==============================================================================
  # Microservices Layer: FastAPI Python Enterprise Integration
  # ==============================================================================

  # ----------------------------------------------------------------------------
  # Service: AuthService (PostgreSQL + Redis Caching)
  # ----------------------------------------------------------------------------
  auth-service:
    build:
      context: ../../
      dockerfile: ./Backend/Services/AuthService/Dockerfile
    image: corpstage/auth-service:latest
    container_name: corpstage-auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      CORPSTAGE_ENVIRONMENT: ${CORPSTAGE_ENVIRONMENT:-development}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-corpstage_super_secure_enterprise_token_signing_key_2026_jwt_auth!}
      DATABASE_URL: postgresql+asyncpg://auth_service_user:AuthServiceSecretPass123!@postgres:5432/corpstage?sslmode=disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - corpstage-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ----------------------------------------------------------------------------
  # Service: TenantService (PostgreSQL + Kafka Event Streaming)
  # ----------------------------------------------------------------------------
  tenant-service:
    build:
      context: ../../
      dockerfile: ./Backend/Services/TenantService/Dockerfile
    image: corpstage/tenant-service:latest
    container_name: corpstage-tenant-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8002:8002"
    environment:
      CORPSTAGE_ENVIRONMENT: ${CORPSTAGE_ENVIRONMENT:-development}
      DATABASE_URL: postgresql://tenant_service_user:TenantServiceSecretPass123!@postgres:5432/corpstage?sslmode=disable
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - corpstage-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ----------------------------------------------------------------------------
  # Service: IngestionService (PostgreSQL + Kafka + MinIO Object Store)
  # ----------------------------------------------------------------------------
  ingestion-service:
    build:
      context: ../../
      dockerfile: ./Backend/Services/IngestionService/Dockerfile
    image: corpstage/ingestion-service:latest
    container_name: corpstage-ingestion-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8003:8003"
    environment:
      CORPSTAGE_ENVIRONMENT: ${CORPSTAGE_ENVIRONMENT:-development}
      DATABASE_URL: postgresql://ingestion_service_user:IngestionServiceSecretPass123!@postgres:5432/corpstage?sslmode=disable
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-corpstage_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-CorpStageAdminPass123!}
    networks:
      - corpstage-network
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ----------------------------------------------------------------------------
  # Service: AIService (PostgreSQL + Kafka + Redis Caching)
  # ----------------------------------------------------------------------------
  ai-service:
    build:
      context: ../../
      dockerfile: ./Backend/Services/AIService/Dockerfile
    image: corpstage/ai-service:latest
    container_name: corpstage-ai-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8004:8004"
    environment:
      CORPSTAGE_ENVIRONMENT: ${CORPSTAGE_ENVIRONMENT:-development}
      DATABASE_URL: postgresql://ai_service_user:AIServiceSecretPass123!@postgres:5432/corpstage?sslmode=disable
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - corpstage-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8004/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ----------------------------------------------------------------------------
  # Service: ReportingService (PostgreSQL + Kafka Event Streaming)
  # ----------------------------------------------------------------------------
  reporting-service:
    build:
      context: ../../
      dockerfile: ./Backend/Services/ReportingService/Dockerfile
    image: corpstage/reporting-service:latest
    container_name: corpstage-reporting-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8005:8005"
    environment:
      CORPSTAGE_ENVIRONMENT: ${CORPSTAGE_ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://reporting_service_user:ReportingServiceSecretPass123!@postgres:5432/corpstage?sslmode=disable
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - corpstage-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8005/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
